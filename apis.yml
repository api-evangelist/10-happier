aid: 10-happier
name: 10% Happier
description: '10% Happier (now branded Happier Meditation) is a consumer meditation
  and mindfulness app founded on the best-selling book "10% Happier" by ABC News anchor
  Dan Harris. The service delivers personalized, science-backed guided meditations,
  courses, and sleep content from well-known teachers through native iOS and Android
  apps and a web player, aimed at helping skeptics and busy people build a sustainable
  mindfulness practice for stress, sleep, focus, and relationships. It operates on
  a subscription model. This profile was surfaced as a portfolio company of Trinity
  Ventures and enriched by the API Evangelist pipeline; 10% Happier is a direct-to-consumer
  app and does not publish a public developer API, so this record captures its identity,
  web properties, and domain-security posture.'
